name: Keeper
options:
  bundleIdPrefix: com.ramihmd.keeper
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Keeper:
    type: application
    platform: macOS
    sources: [Keeper]
    dependencies:
      - package: Sparkle
    info:
      path: Keeper/Info.plist
      properties:
        CFBundleDisplayName: Keeper
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        SUFeedURL: https://keeper.ramihmd.com/appcast.xml
        SUPublicEDKey: qOxwZqP7ofp2K4TUTCMqAA5P8EF/sbNrcEubiWKNHTE=
        SUEnableAutomaticChecks: true
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "MIT License"
        NSPhotoLibraryUsageDescription: "Keeper puts the photos you pick into a new album in Photos, so you can share it."
        NSPhotoLibraryAddUsageDescription: "Keeper puts the photos you pick into a new album in Photos, so you can share it."
        NSAppleEventsUsageDescription: "Keeper opens Photos on the album it just made."
        NSRemovableVolumesUsageDescription: "Keeper reads the photos on your camera's memory card."
    entitlements:
      path: Keeper/Keeper.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramihmd.keeper.Keeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 8Z6WRF99H5
          OTHER_CODE_SIGN_FLAGS: --timestamp
  KeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources: [KeeperTests]
    dependencies:
      - target: Keeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Keeper:
    build:
      targets:
        Keeper: all
    test:
      targets: [KeeperTests]
